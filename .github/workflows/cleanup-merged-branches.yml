name: Cleanup Merged Branches

on:
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC
  workflow_dispatch: {}
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/cleanup-merged-branches.yml"
      - "scripts/cleanup-merged-branches.sh"

jobs:
  dry-run:
    name: Dry run
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Dry run
        env:
          GH_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
        run: scripts/cleanup-merged-branches.sh --dry-run | tee dry-run-output.txt

      - name: Post results to PR
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('dry-run-output.txt', 'utf8').slice(0, 60000);
            const body = `### Branch Cleanup Dry Run\n\`\`\`\n${output}\n\`\`\``;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

  cleanup:
    name: Cleanup
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Delete merged branches
        env:
          GH_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
        run: scripts/cleanup-merged-branches.sh
