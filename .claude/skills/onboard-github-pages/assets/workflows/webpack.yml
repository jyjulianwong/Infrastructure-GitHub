name: CI
on:
  push:
    branches: [main]
permissions:
  contents: read
  id-token: write
  pages: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    name: Build app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
        # Add any webpack EnvironmentPlugin secrets this app needs here, e.g.:
        # env:
        #   SOME_KEY: ${{ secrets.SOME_KEY }}
        # Do NOT add a *_BASENAME override here — this app is served from
        # the domain root from day one, so the webpack config's own
        # default (empty basename) is already correct.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/
  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.ref_name == 'main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
