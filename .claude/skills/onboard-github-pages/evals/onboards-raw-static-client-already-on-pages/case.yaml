    from https://jyjulianwong.github.io/Demo-Mkdocs-Site/ to
    https://demo-mkdocs-site.jyjwong.com/ (the cross-repo self-link case)
  - Correctly judges that no other base-path fix is needed, since the
    existing asset references are already relative
  - Adds a new, alphabetically-placed "Demo-Raw-Static" entry to
    fake-infra/terraform/variables.tf's pages_domain_repositories map, and
    the terraform validation step passes
  - Produces a report.md describing both PRs it would open
