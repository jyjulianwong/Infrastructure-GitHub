schema_version: "1.1"
name: onboards-cra-app-already-on-pages
expected_outcome: |
  The skill correctly identifies this as the "cra" variant (react-scripts
  dependency) and, without needing any live GitHub calls:
  - Adds demo-cra-app/public/CNAME containing demo-cra-app.jyjwong.com
  - Updates package.json's homepage field to
    https://demo-cra-app.jyjwong.com/ (from the old jyjulianwong.github.io
    URL)
  - Correctly notes the default branch is master, not main, when
    describing the PR it would open
  - Adds a new, alphabetically-placed "Demo-CRA-App" entry to
    fake-infra/terraform/variables.tf's pages_domain_repositories map, and
    the terraform validation step passes
  - Produces a report.md describing both PRs it would open
